name: SMC Radar website

# Scans gold, bitcoin and WTI crude oil every 15 minutes and publishes them to GitHub Pages,
# one link with a market tab bar: https://ksexpressresources-dev.github.io/Gold-Trading/
#
# GitHub often starts scheduled runs late (about hourly when busy), so each run scans and
# publishes four times, 15 minutes apart. The concurrency group queues the next run, so the
# site keeps updating every quarter hour. A failed Pages deploy is retried once.
on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [claude/funny-ritchie-qt1dqv]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: smc-radar
  cancel-in-progress: false

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment:
      name: github-pages
      url: https://ksexpressresources-dev.github.io/Gold-Trading/
    env:
      # optional: spot XAU/USD from Twelve Data; without it the scanner falls back to GC=F futures
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas numpy requests

      - uses: actions/configure-pages@v5

      # ---------------- round 1 ----------------
      - name: "Round 1: scan gold, bitcoin and WTI, build site"
        run: |
          python radar.py --asset XAU || [ $? -eq 2 ] || echo "::warning::gold scan failed"
          python radar.py --asset BTC || [ $? -eq 2 ] || echo "::warning::bitcoin scan failed"
          python radar.py --asset WTI || [ $? -eq 2 ] || echo "::warning::WTI scan failed"
          rm -rf _site && python tools/build_site.py --out _site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: pages-1

      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: pages-1

      - name: "Round 1: wait before retrying the deploy"
        if: steps.deploy1.outcome == 'failure'
        run: sleep 20

      - if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-1

      # ---------------- round 2 ----------------
      - name: "Round 2: scan gold, bitcoin and WTI, build site"
        run: |
          now=$(date +%s); next=$(( (now / 900 + 1) * 900 + 60 )); echo "waiting $((next - now))s for the next quarter hour"; sleep $((next - now))
          python radar.py --asset XAU || [ $? -eq 2 ] || echo "::warning::gold scan failed"
          python radar.py --asset BTC || [ $? -eq 2 ] || echo "::warning::bitcoin scan failed"
          python radar.py --asset WTI || [ $? -eq 2 ] || echo "::warning::WTI scan failed"
          rm -rf _site && python tools/build_site.py --out _site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: pages-2

      - id: deploy2
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: pages-2

      - name: "Round 2: wait before retrying the deploy"
        if: steps.deploy2.outcome == 'failure'
        run: sleep 20

      - if: steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-2

      # ---------------- round 3 ----------------
      - name: "Round 3: scan gold, bitcoin and WTI, build site"
        run: |
          now=$(date +%s); next=$(( (now / 900 + 1) * 900 + 60 )); echo "waiting $((next - now))s for the next quarter hour"; sleep $((next - now))
          python radar.py --asset XAU || [ $? -eq 2 ] || echo "::warning::gold scan failed"
          python radar.py --asset BTC || [ $? -eq 2 ] || echo "::warning::bitcoin scan failed"
          python radar.py --asset WTI || [ $? -eq 2 ] || echo "::warning::WTI scan failed"
          rm -rf _site && python tools/build_site.py --out _site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: pages-3

      - id: deploy3
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: pages-3

      - name: "Round 3: wait before retrying the deploy"
        if: steps.deploy3.outcome == 'failure'
        run: sleep 20

      - if: steps.deploy3.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-3

      # ---------------- round 4 ----------------
      - name: "Round 4: scan gold, bitcoin and WTI, build site"
        run: |
          now=$(date +%s); next=$(( (now / 900 + 1) * 900 + 60 )); echo "waiting $((next - now))s for the next quarter hour"; sleep $((next - now))
          python radar.py --asset XAU || [ $? -eq 2 ] || echo "::warning::gold scan failed"
          python radar.py --asset BTC || [ $? -eq 2 ] || echo "::warning::bitcoin scan failed"
          python radar.py --asset WTI || [ $? -eq 2 ] || echo "::warning::WTI scan failed"
          rm -rf _site && python tools/build_site.py --out _site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: pages-4

      - id: deploy4
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: pages-4

      - name: "Round 4: wait before retrying the deploy"
        if: steps.deploy4.outcome == 'failure'
        run: sleep 20

      - if: steps.deploy4.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-4
